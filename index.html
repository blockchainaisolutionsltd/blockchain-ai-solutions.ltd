<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwvecIP9WLpbAf8mjjM48YPyutfu0x5bjWs2kt50VEQMFRWDVyPYEhkyvwh3dgWR6WsVA/exec';

async function checkStatus() {
    const email = document.getElementById('check-email').value.trim().toLowerCase();
    const msgDiv = document.getElementById('status-msg');
    const btn = document.getElementById('checkBtn');

    if (!email || !email.includes('@')) {
        alert("Inserisci un'email valida.");
        return;
    }

    btn.innerText = "CONTROLLO...";
    btn.disabled = true;
    msgDiv.style.display = "none";

    try {
        const response = await fetch(`${SCRIPT_URL}?searchEmail=${encodeURIComponent(email)}`);
        if (!response.ok) throw new Error("Errore server");
        const data = await response.json();

        msgDiv.style.display = "block";
        if (data.found) {
            msgDiv.className = "status-message status-online";
            msgDiv.innerText = "PRATICA IN CORSO PER: " + data.name;
        } else {
            msgDiv.className = "status-message status-offline";
            msgDiv.innerText = "NESSUNA PRATICA TROVATA";
        }
    } catch (error) {
        msgDiv.style.display = "block";
        msgDiv.className = "status-message status-offline";
        msgDiv.innerText = "ERRORE DI CONNESSIONE AL DATABASE";
    } finally {
        btn.innerText = "VERIFICA PRATICA";
        btn.disabled = false;
    }
}

function resetStatus() {
    document.getElementById('status-msg').style.display = "none";
}

document.getElementById('ticketForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const originalText = btn.innerText;

    btn.innerText = "INVIO IN CORSO...";
    btn.disabled = true;

    const params = new URLSearchParams();
    params.append("taxID", document.getElementById("t-cf").value);
    params.append("fullName", document.getElementById("t-nome").value);
    params.append("email", document.getElementById("t-email").value.toLowerCase());
    params.append("phone", document.getElementById("t-tel").value);
    params.append("amount", document.getElementById("t-importo").value);
    params.append("details", document.getElementById("t-dettagli").value);

    try {
        await fetch(SCRIPT_URL, { 
            method: 'POST', 
            body: params,
            mode: 'no-cors' 
        });
        
        btn.innerText = "Segnalazione Inviata! Verrai ricontattato.";
        btn.style.background = "#22c55e"; 
        e.target.reset();
        setTimeout(() => { 
            btn.innerText = originalText; 
            btn.style.background = "#c9a44c"; 
            btn.disabled = false; 
        }, 5000);
    } catch (error) {
        alert("Errore nell'invio del report.");
        btn.innerText = originalText;
        btn.disabled = false;
    }
});

function showSection(section) {
    const explorer = document.getElementById('section-explorer');
    const report = document.getElementById('section-report');
    if (window.innerWidth <= 768) {
        if (section === 'explorer') { explorer.style.display = 'flex'; report.style.display = 'none'; }
        else { explorer.style.display = 'none'; report.style.display = 'flex'; }
    } else {
        if (section === 'report') { report.scrollIntoView({ behavior: 'smooth' }); }
        else { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    }
}

function detectNetwork() {
    let addr = document.getElementById("addressInput").value.trim();
    document.querySelectorAll('.net-item').forEach(i => i.classList.remove('active'));
    if(!addr) return null;
    if(addr.match(/^(1|3|bc1)/)) { document.getElementById("n-btc").classList.add("active"); return "BTC"; }
    if(addr.startsWith("0x")) { 
        document.getElementById("n-eth").classList.add("active"); 
        document.getElementById("n-bsc").classList.add("active"); 
        document.getElementById("n-poly").classList.add("active"); 
        return "EVM"; 
    }
    if(addr.startsWith("T") && addr.length === 34) { document.getElementById("n-trx").classList.add("active"); return "TRX"; }
    if(addr.length > 30 && !addr.startsWith("0x")) { document.getElementById("n-sol").classList.add("active"); return "SOL"; }
    return "OTHER";
}

function startScan() {
    let addr = document.getElementById("addressInput").value.trim();
    let net = detectNetwork() || "OTHER";
    if(!addr) { alert("Inserisci un indirizzo wallet."); return; }
    const explorers = { "BTC": "https://www.blockchain.com/explorer/addresses/btc/", "EVM": "https://etherscan.io/address/", "TRX": "https://tronscan.org/#/address/", "SOL": "https://solscan.io/account/", "OTHER": "https://blockchair.com/search?q=" };
    document.getElementById("resultsBody").innerHTML = `<tr><td>${addr.substring(0,12)}...</td><td>${net}</td><td>NODO_UFFICIALE</td><td><span class="status-badge">REINDIRIZZAMENTO</span></td></tr>`;
    document.getElementById("log-feed").innerText = `[IDENTIFICATO] Rete ${net}. Reindirizzamento al nodo ufficiale forense...`;
    setTimeout(() => { window.open(explorers[net === "EVM" ? "EVM" : net] + addr, '_blank'); }, 1200);
}

const canvas = document.getElementById("blockchain-canvas");
const ctx = canvas.getContext("2d");
let nodes = [];
function init() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; nodes = []; for (let i = 0; i < 40; i++) nodes.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, radius: 2 }); }
function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); nodes.forEach(n => { n.x += n.vx; n.y += n.vy; if (n.x < 0 || n.x > canvas.width) n.vx *= -1; if (n.y < 0 || n.y > canvas.height) n.vy *= -1; ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2); ctx.fillStyle = "rgba(0, 51, 102, 0.2)"; ctx.fill(); }); requestAnimationFrame(draw); }
init(); draw();
window.onresize = init;
</script>
